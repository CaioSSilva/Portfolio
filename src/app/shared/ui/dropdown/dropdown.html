<div class="relative w-full">
  <button
    type="button"
    data-dropdown-trigger
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="listboxId"
    aria-haspopup="listbox"
    class="flex h-10 w-full items-center justify-between rounded-xl border border-gnome-border bg-gnome-header px-3 text-left text-sm font-medium text-gnome-text shadow-sm transition-colors hover:border-gnome-blue/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gnome-blue/60 cursor-pointer"
  >
    <span>{{ selectedOption?.label }}</span>
    <i
      class="fas fa-chevron-down text-[10px] text-gnome-text-secondary transition-transform"
      [class.rotate-180]="isOpen()"
      aria-hidden="true"
    ></i>
  </button>
  @if (isOpen()) {
    <div
      role="listbox"
      [id]="listboxId"
      [attr.aria-label]="ariaLabel()"
      class="absolute right-0 top-full z-50 mt-2 w-full overflow-hidden rounded-xl border border-gnome-border bg-gnome-surface p-1.5 shadow-xl ring-1 ring-black/5 animate-in"
    >
      @for (option of options(); track option.value) {
        <button
          type="button"
          role="option"
          [attr.data-dropdown-option]="option.value"
          [attr.aria-selected]="value() === option.value"
          (click)="select(option)"
          (keydown)="onOptionKeydown($event, option.value)"
          class="flex w-full items-center justify-between rounded-lg px-3 py-2 text-left text-sm text-gnome-text transition-colors hover:bg-gnome-header focus-visible:bg-gnome-header focus-visible:outline-none cursor-pointer"
          [class.bg-gnome-blue/10]="value() === option.value"
          [class.text-gnome-blue]="value() === option.value"
        >
          <span>{{ option.label }}</span>
          @if (value() === option.value) {
            <i class="fas fa-check text-xs" aria-hidden="true"></i>
          }
        </button>
      }
    </div>
  }
</div>
