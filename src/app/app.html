@if (!systemReady()) {
  <app-boot (bootFinished)="systemReady.set(true)"></app-boot>
} @else {
  @if (isShuttingDown()) {
    <app-shutdown (shutdown)="isShuttingDown.set($event)"></app-shutdown>
  }

  <div class="relative w-screen overflow-hidden bg-gnome-bg" style="height: 100dvh">
    <div class="absolute inset-0 z-0">
      @if (isAnimated()) {
        <video
          #bgVideo
          autoplay
          loop
          muted
          playsinline
          [src]="settingsService.wallpaper()"
          class="h-full w-full object-cover"
        ></video>
      } @else {
        <div
          class="h-full w-full bg-cover bg-center"
          [style.background-image]="'url(' + settingsService.wallpaper() + ')'"
        ></div>
      }
    </div>

    <div class="relative z-10 flex flex-col h-full w-full pointer-events-none">
      <app-top-bar
        class="pointer-events-auto"
        (onShutdown)="isShuttingDown.set($event)"
      ></app-top-bar>

      <div class="flex-1 relative desktop-area pointer-events-auto">
        <app-desktop-icons></app-desktop-icons>

        @for (process of processManager.processes(); track process.id) {
          <app-window class="contents" [process]="process"></app-window>
        }

        <app-apps-grid></app-apps-grid>
        @if (!screen.isMobile()) {
          <app-dock></app-dock>
          <app-window-switcher></app-window-switcher>
        } @else {
          <app-mobile-nav-bar></app-mobile-nav-bar>
          <app-mobile-overview></app-mobile-overview>
        }

        <app-context-menu></app-context-menu>
      </div>
    </div>
  </div>
}
