@if (player.currentTrack()) {
  <div class="mx-4 border-t border-gnome-border/40 mb-3"></div>
  <div
    (click)="openPlayer()"
    class="mx-4 mb-0 md:mb-4 mt-0 bg-gnome-surface/60 border border-gnome-border/40 rounded-t-2xl rounded-b-[24px] md:rounded-b-lg p-3.5 flex flex-col gap-2.5 cursor-pointer active:opacity-80 transition-opacity"
  >
    <div class="flex items-center gap-3 min-w-0 w-full">
      <div class="w-9 h-9 rounded-xl bg-gnome-blue flex items-center justify-center shrink-0 overflow-hidden">
        @if (player.currentTrack()?.thumb && !widgetThumbError()) {
          <img
            [src]="player.currentTrack()!.thumb"
            (error)="widgetThumbError.set(true)"
            class="w-full h-full object-cover"
            alt=""
          />
        }
        @if (!player.currentTrack()?.thumb || widgetThumbError()) {
          <i
            class="fas fa-compact-disc text-white text-sm"
            [class.disc-playing]="player.discSpinState() === 'playing' && !player.isLoading()"
            [class.disc-seeking-forward]="player.discSpinState() === 'seeking-forward'"
            [class.disc-seeking-backward]="player.discSpinState() === 'seeking-backward'"
          ></i>
        }
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-bold text-gnome-text truncate">{{ player.currentTrack()!.name }}</p>
        <p class="text-[10px] text-gnome-text-secondary">{{ lang.t().audioPlayer.nowPlaying }}</p>
      </div>
      <i class="fas fa-chevron-right text-[10px] text-gnome-text-secondary opacity-50 shrink-0"></i>
    </div>

    <div class="flex items-center justify-center gap-5">
      <button
        (click)="player.prevTrack(); $event.stopPropagation()"
        class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gnome-text/10 active:scale-90 transition-all cursor-pointer text-gnome-text opacity-70 hover:opacity-100"
      >
        <i class="fas fa-backward-step text-base"></i>
      </button>
      <button
        (click)="player.togglePlay(); $event.stopPropagation()"
        class="w-11 h-11 flex items-center justify-center bg-gnome-blue rounded-full shadow-lg hover:opacity-90 active:scale-95 transition-all cursor-pointer"
      >
        @if (player.isLoading()) {
          <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
        } @else {
          <i
            class="fas text-white text-base"
            [class.fa-play]="!player.isPlaying()"
            [class.fa-pause]="player.isPlaying()"
          ></i>
        }
      </button>
      <button
        (click)="player.nextTrack(); $event.stopPropagation()"
        class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gnome-text/10 active:scale-90 transition-all cursor-pointer text-gnome-text opacity-70 hover:opacity-100"
      >
        <i class="fas fa-forward-step text-base"></i>
      </button>
    </div>

    <div class="flex items-center gap-2" (click)="$event.stopPropagation()">
      <span class="text-[10px] font-mono text-gnome-text-secondary w-7 text-right shrink-0">
        {{ formatTime(displayTime()) }}
      </span>
      <input
        type="range"
        [min]="0"
        [max]="player.duration()"
        [value]="displayTime()"
        (pointerdown)="onSeekStart($event)"
        (input)="onSeekMove($event)"
        (pointerup)="onSeekEnd($event)"
        (pointercancel)="onSeekEnd($event)"
        [style.--slider-pct]="(player.duration() > 0 ? (displayTime() / player.duration()) * 100 : 0) + '%'"
        class="gnome-slider flex-1 h-1.5 appearance-none cursor-pointer rounded-full"
      />
      <span class="text-[10px] font-mono text-gnome-text-secondary w-7 shrink-0">
        {{ formatTime(player.duration()) }}
      </span>
    </div>
  </div>
}
