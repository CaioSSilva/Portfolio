<div
  class="fixed bottom-0 left-0 right-0 h-12 z-[9500] bg-gnome-bg/90 backdrop-blur-2xl border-t border-gnome-border/30 flex items-center justify-around px-6 shadow-2xl"
>
  <button
    (click)="tap(nav.toggleOverview.bind(nav))"
    class="w-12 h-10 flex items-center justify-center rounded-xl text-gnome-text hover:bg-black/10 active:scale-90 transition-all cursor-pointer relative touch-manipulation"
    [attr.aria-label]="lang.t().mobileNav.recentApps"
  >
    <div
      class="w-4 h-4 border-2 border-gnome-text rounded-[4px] transition-transform"
      [class.border-gnome-blue]="nav.isOverviewOpen()"
      [class.rotate-90]="nav.isOverviewOpen()"
    ></div>
    @if (processManager.processes().length > 0) {
      <div class="absolute top-2 right-2.5 w-1.5 h-1.5 bg-gnome-blue rounded-full"></div>
    }
  </button>
  <button
    (click)="tap(nav.goHome.bind(nav))"
    class="w-16 h-10 flex items-center justify-center rounded-2xl text-gnome-text hover:bg-black/10 active:scale-90 transition-all cursor-pointer touch-manipulation"
    [attr.aria-label]="lang.t().mobileNav.home"
  >
    <div class="w-10 h-1.5 bg-gnome-text/70 rounded-full hover:bg-gnome-text transition-colors"></div>
  </button>
  <button
    (click)="tap(nav.toggleAppDrawer.bind(nav))"
    class="w-12 h-10 flex items-center justify-center rounded-xl text-gnome-text hover:bg-black/10 active:scale-90 transition-all cursor-pointer touch-manipulation"
    [attr.aria-label]="lang.t().mobileNav.allApps"
  >
    <div class="grid grid-cols-2 gap-1 w-3.5 h-3.5">
      <div class="bg-gnome-text/80 rounded-[2px]"></div>
      <div class="bg-gnome-text/80 rounded-[2px]"></div>
      <div class="bg-gnome-text/80 rounded-[2px]"></div>
      <div class="bg-gnome-text/80 rounded-[2px]"></div>
    </div>
  </button>
</div>
