@if (player.currentTrack()) {
  <button
    (click)="openPlayer()"
    title="{{ lang.t().audioPlayer.nowPlaying }}"
    class="now-playing-widget flex items-center gap-1.5 px-2 py-1 rounded-full cursor-pointer select-none
           bg-gnome-text/8 hover:bg-gnome-text/15 border border-gnome-border/20
           transition-colors duration-150 max-w-[180px] sm:max-w-[220px] overflow-hidden"
  >
    <i
      class="fas fa-compact-disc text-[13px] shrink-0"
      [class.widget-disc-playing]="player.discSpinState() === 'playing'"
      [class.widget-disc-seeking-forward]="player.discSpinState() === 'seeking-forward'"
      [class.widget-disc-seeking-backward]="player.discSpinState() === 'seeking-backward'"
      [class.widget-disc-paused]="player.discSpinState() === 'paused'"
    ></i>
    <span class="text-[10px] sm:text-[11px] font-semibold truncate leading-none text-gnome-text">
      {{ player.currentTrack()!.name }}
    </span>
  </button>
}
