@if (appsService.isAppsGridOpen()) {
  <div
    (click)="onBackdropClick()"
    class="fixed inset-0 z-[9600] bg-gnome-bg/80 backdrop-blur-[40px] flex flex-col items-center pt-[6vh] sm:pt-[8vh] animate-in fade-in duration-200"
  >
    <div
      class="w-full max-w-5xl flex flex-col items-center gap-6 sm:gap-10 p-4 sm:p-6 animate-in zoom-in-95 duration-300"
    >
      <div
        (click)="$event.stopPropagation()"
        class="relative w-full max-w-lg group"
      >
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <i
            class="fas fa-search text-sm text-gnome-text-secondary group-focus-within:text-gnome-blue transition-colors duration-200"
          ></i>
        </div>
        <input
          type="text"
          [placeholder]="lang.t().common.search"
          class="block w-full pl-10 pr-10 py-2.5 bg-gnome-surface/80 border border-gnome-border rounded-full text-sm text-gnome-text placeholder:text-gnome-text-secondary/60 outline-none focus:ring-2 focus:ring-gnome-blue/40 focus:border-gnome-blue/40 shadow-lg transition-all duration-200"
          [value]="appsService.searchQuery()"
          (input)="onSearch($event)"
          autoFocus
        />
        @if (appsService.searchQuery()) {
          <button
            (click)="appsService.searchQuery.set(''); $event.stopPropagation()"
            class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-gnome-text-secondary hover:text-gnome-text transition-colors"
          >
            <i class="fas fa-times-circle text-sm"></i>
          </button>
        }
      </div>
      <div
        [class.pointer-events-none]="contextMenu.isOpen()"
        class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-9 gap-x-3 sm:gap-x-4 gap-y-6 sm:gap-y-8 w-full h-full p-2 sm:p-4 max-h-[75vh] overflow-y-auto custom-scrollbar justify-items-center"
      >
        @for (app of appsService.appSearchResult(); track app.id) {
          <button
            [attr.draggable]="!screen.isMobile()"
            (dragstart)="ondragStart($event, app)"
            (contextmenu)="appsService.onRightClickApp($event, app.id)"
            (click)="onAppClick($event, app)"
            (touchstart)="onAppTouchStart($event, app)"
            (touchmove)="onAppTouchMove($event)"
            (touchend)="onAppTouchEnd($event, app)"
            class="group relative flex cursor-pointer flex-col items-center gap-2 sm:gap-3 outline-none transition-all touch-manipulation"
          >
            <div
              class="relative w-[52px] h-[52px] sm:w-[60px] sm:h-[60px] flex items-center justify-center transition-transform duration-300 group-hover:scale-110 group-active:scale-95"
            >
              <div
                class="absolute inset-0 rounded-[14px] sm:rounded-[16px] overflow-hidden shadow-md ring-1 ring-white/10 dark:ring-white/5"
                [style.background-color]="app.color || '#3584e4'"
                [style.box-shadow]="'0 8px 20px -5px ' + (app.color || '#3584e4') + '55'"
              >
                <div
                  class="absolute top-0 inset-x-0 h-1/2 bg-gradient-to-b from-white/20 to-transparent"
                ></div>
              </div>

              <i [class]="app.icon" class="relative z-20 text-xl sm:text-2xl text-white drop-shadow-md"></i>
            </div>

            <span
              class="text-gnome-text font-medium text-[11px] sm:text-[12px] text-center tracking-tight line-clamp-2 w-20 sm:w-24 leading-tight opacity-90 group-hover:opacity-100 transition-opacity"
            >
              {{ $any(lang.t().apps)[app.id] || app.title }}
            </span>
          </button>
        }
      </div>

      @if (appsService.appSearchResult().length === 0) {
        <div
          (click)="$event.stopPropagation()"
          class="flex flex-col items-center gap-3 text-gnome-text-secondary mt-10 opacity-60"
        >
          <i class="far fa-sad-tear text-3xl"></i>
          <span class="text-base tracking-wide">{{ lang.t().files.noResults }}</span>
        </div>
      }
    </div>
    <app-context-menu></app-context-menu>
  </div>
}
